<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3817 SVS</title>

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-VKMP03KGXC"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-VKMP03KGXC');
    </script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e9ecef;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 350px;
            text-align: center;
            display: flex;
            flex-direction: column;
            max-height: 90vh;
        }
        h2 { margin-top: 0; color: #333; }
        
        .search-box {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
            align-items: center; 
        }
        
        select, input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            text-align: center;
            color: #444; 
            caret-color: #444;
        }
        select { background-color: #fafafa; cursor: pointer; }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            width: 65%; 
            transition: background-color 0.2s;
        }
        button:hover { background-color: #0056b3; }
        
        .results-container {
            overflow-y: auto;
            flex-grow: 1;
            padding-right: 5px;
        }

        .results-container::-webkit-scrollbar { width: 6px; }
        .results-container::-webkit-scrollbar-thumb { background-color: #ccc; border-radius: 4px; }

        .result-card {
            display: none; 
            text-align: left;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border-left: 5px solid #28a745;
            margin-bottom: 10px;
        }
        .result-card p {
            margin: 8px 0;
            font-size: 15px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 5px;
        }
        
        .result-card span { font-weight: bold; color: #0056b3; } 
        
        .loading { color: #666; font-style: italic; display: none; margin-bottom: 10px; }
        .error { color: red; font-weight: bold; display: none; margin-top: 10px; font-size: 14px;}
        
        .badge {
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .badge-success {
            background: #28a745 !important;
            color: #ffffff !important;
        }
        
        .badge-danger {
            background: #dc3545 !important;
            color: #ffffff !important; 
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>3817 SVS</h2>
        
        <div class="search-box">
            <select id="sheetSelect" onchange="toggleInput()">
                <option value="3800">STATE 3800</option>
                <option value="BLACKLIST">BLACKLIST</option> 
            </select>
            
            <input type="text" id="searchInput" placeholder="Enter Player ID">
            <button id="searchBtn" onclick="searchData()">Search</button>
        </div>

        <div id="loading" class="loading">Searching data...</div>
        <div id="error" class="error">Not in Top 200</div>

        <div id="resultsArea" class="results-container">
            <div id="singleResultCard" class="result-card">
                <p><strong>Name:</strong> <span id="resName">-</span></p>
                <p><strong>ID:</strong> <span id="resID">-</span></p>
                <p><strong>Alliance:</strong> <span id="resAliance">-</span></p>
                <p id="field-points"><strong>Points:</strong> <span id="resPoint">-</span></p>
                <p id="field-rank"><strong>Rank:</strong> <span id="resRank">-</span></p>
                <p id="field-status"><strong>Status:</strong> <span id="resStatus">-</span></p>
            </div>
            
            <div id="blacklistResults"></div>
        </div>
    </div>

    <script>
        const sheetId = '1YYqoZq_8UyVkxg6rhGOJcucYFytV5sBrc5FEVksCNlY';

        function toggleInput() {
            const selectedSheet = document.getElementById('sheetSelect').value;
            const searchInput = document.getElementById('searchInput');
            const searchBtn = document.getElementById('searchBtn');
            
            document.getElementById('singleResultCard').style.display = 'none';
            document.getElementById('blacklistResults').innerHTML = '';
            document.getElementById('error').style.display = 'none';

            if (selectedSheet === 'BLACKLIST') {
                searchInput.style.display = 'none';
                searchBtn.innerText = 'Show All Blacklist';
            } else {
                searchInput.style.display = 'block';
                searchBtn.innerText = 'Search';
            }
        }

        document.getElementById('searchInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                e.preventDefault(); 
                searchData();
            }
        });

        async function searchData() {
            const selectedSheet = document.getElementById('sheetSelect').value;
            const searchInput = document.getElementById('searchInput').value.replace(/\s+/g, '');
            const isBlacklist = (selectedSheet === 'BLACKLIST');
            
            // 🎯 ส่งคำค้นหาไปที่ GA4
            if (!isBlacklist && searchInput && typeof gtag === 'function') {
                gtag('event', 'search', {
                    search_term: searchInput,
                    search_type: selectedSheet
                });
            }

            const singleResultCard = document.getElementById('singleResultCard');
            const blacklistResults = document.getElementById('blacklistResults');
            const errorMsg = document.getElementById('error');
            const loading = document.getElementById('loading');

            if (!isBlacklist && !searchInput) {
                alert('Please enter an ID before searching.');
                return;
            }

            singleResultCard.style.display = 'none';
            blacklistResults.innerHTML = '';
            errorMsg.style.display = 'none';
            loading.style.display = 'block';

            const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&sheet=${selectedSheet}`;

            try {
                const response = await fetch(url);
                const text = await response.text();
                const match = text.match(/google\.visualization\.Query\.setResponse\(([\s\S\w]+)\);?/);
                
                if (!match) throw new Error("Cannot retrieve JSON format");

                const data = JSON.parse(match[1]);
                if (!data.table || !data.table.rows) throw new Error("No table data found in selected state");

                const rows = data.table.rows;

                // --- เริ่มต้นส่วนแก้ไข BLACKLIST ---
                if (isBlacklist) {
                    if (rows.length === 0) {
                        loading.style.display = 'none';
                        errorMsg.innerText = "Blacklist is empty.";
                        errorMsg.style.display = 'block';
                        return;
                    }

                    let allHtml = "";
                    let validCount = 0; // เพิ่มตัวแปรเพื่อนับแถวที่มีข้อมูลจริงๆ

                    for (let i = 0; i < rows.length; i++) {
                        const row = rows[i];
                        if (!row || !row.c) continue; // ข้ามแถวที่ไม่มี object ข้อมูล

                        // ดึงข้อมูลและแปลงเป็น String เพื่อป้องกัน Error
                        const alliance = row.c[0] && row.c[0].v ? String(row.c[0].v).trim() : '-';
                        const id = row.c[1] && row.c[1].v ? String(row.c[1].v).trim() : '-';
                        const name = row.c[2] && row.c[2].v ? String(row.c[2].v).trim() : '-';
                        const punish = row.c[3] ? String(row.c[3].f || row.c[3].v).trim() : '-';

                        // 1. ข้ามแถวที่ ID และ Name เป็นค่าว่าง หรือเป็น '-'
                        if ((id === '-' && name === '-') || (!id && !name)) continue;
                        
                        // 2. ข้ามแถวที่เป็นหัวตาราง (Header)
                        if (id.toLowerCase() === 'id' || name.toLowerCase() === 'name') continue;

                        validCount++;
                        allHtml += `
                            <div class="result-card" style="display: block; border-left: 5px solid #dc3545;">
                                <p><strong>Name:</strong> <span>${name}</span></p>
                                <p><strong>ID:</strong> <span>${id}</span></p>
                                <p><strong>Alliance:</strong> <span>${alliance}</span></p>
                                <p><strong>Punish:</strong> <span class="badge badge-danger">${punish}</span></p>
                            </div>
                        `;
                    }
                    
                    loading.style.display = 'none';

                    // ถ้ากรองข้อมูลแล้วไม่มีคนติด Blacklist เลย จะไม่แสดงการ์ดเปล่าๆ แต่จะแจ้งเตือนแทน
                    if (validCount === 0) {
                        errorMsg.innerText = "Blacklist is empty";
                        errorMsg.style.display = 'block';
                    } else {
                        blacklistResults.innerHTML = allHtml;
                    }
                    
                    return; 
                }
                // --- สิ้นสุดส่วนแก้ไข BLACKLIST ---

                let found = false;
                for (let i = 0; i < rows.length; i++) {
                    const row = rows[i];
                    const cellID = row.c[2] && row.c[2].v ? String(row.c[2].v).trim() : ''; 

                    if (cellID === searchInput) {
                        const rank = row.c[0] && row.c[0].v ? row.c[0].v : '-';
                        const alliance = row.c[1] && row.c[1].v ? row.c[1].v : '-';
                        const name = row.c[3] && row.c[3].v ? row.c[3].v : '-';
                        const points = row.c[4] ? (row.c[4].f || row.c[4].v) : '-'; 
                        const status = row.c[5] && row.c[5].v ? row.c[5].v : '-';

                        document.getElementById('resName').innerText = name;
                        document.getElementById('resID').innerText = searchInput;
                        document.getElementById('resAliance').innerText = alliance || '-';
                        document.getElementById('resPoint').innerText = points;
                        document.getElementById('resRank').innerText = rank;
                        
                        const statusSpan = document.getElementById('resStatus');
                        statusSpan.innerText = status || '-';
                        statusSpan.className = status ? 'badge badge-success' : 'badge';

                        found = true;
                        break;
                    }
                }

                loading.style.display = 'none';
                
                if (found) {
                    singleResultCard.style.display = 'block';
                } else {
                    errorMsg.innerText = "Not in Top 200";
                    errorMsg.style.display = 'block';
                }

            } catch (error) {
                loading.style.display = 'none';
                errorMsg.innerText = "System Error: " + error.message;
                errorMsg.style.display = 'block';
                console.error(error);
            }
        }
    </script>
</body>
</html>
